services:
  core:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    ports:
      - "8080:80"
    environment:
      SKYNDA_BASE_URL: http://skynda:8080
    volumes:
      - core_db:/var/www/html/db
      - core_storage:/var/www/html/storage
    networks:
      - app-network

  skynda:
    build:
      context: ../microsservices/skynda
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      CORE_BASE_URL: http://core
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  core_db:
  core_storage: